name: dockerhub

# Optional Docker Hub mirror. Runs only when DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN exist in the repository secrets; otherwise it exits cleanly.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$U" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub secrets are not set — skipping."
          fi

      - if: steps.check.outputs.ready == '1'
        uses: docker/setup-qemu-action@v3
      - if: steps.check.outputs.ready == '1'
        uses: docker/setup-buildx-action@v3
      - if: steps.check.outputs.ready == '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.check.outputs.ready == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yt2abs:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/yt2abs:${{ github.ref_name }}
